<body class="dark-vertion black-bg card-page">
	<div class="ambient-bg" aria-hidden="true">
		<div class="ambient-bg__wash"></div>
		<div class="ambient-bg__grid"></div>
	</div>

	<div class="site-shell">
		<main class="card-page-wrap">

			<div class="card-top">
				<section class="card-hero">
					<div class="card-hero__photo-frame">
						<img src="../assets/images/site/niloy-profile5-cutout.png" alt="Niloy Biswas" class="card-hero__photo">
					</div>
				</section>

				<div class="card-identity">
					<h1 class="card-hero__name">Niloy <span class="card-hero__name-last">Biswas</span></h1>
					<header class="card-intro">
						<p class="card-hero__role">BI Analyst &amp;<br class="card-hero__role-break" aria-hidden="true">AI/LLM Engineer</p>
						<p class="card-hero__org">10 Minute School</p>
						<p class="card-hero__tagline">Building AI agents &amp; data systems that scale.</p>
					</header>
				</div>
			</div>

			<div class="card-panel">
				<section class="card-tags">
					<span class="card-section-label">Specializes In</span>
					<div class="card-tags__row">
						<span class="glass-chip card-tag card-tag--ai">AI/LLM</span>
						<span class="glass-chip card-tag card-tag--data">Data Analytics</span>
						<span class="glass-chip card-tag card-tag--data">BI</span>
						<span class="glass-chip card-tag">EdTech</span>
					</div>
				</section>

				<section class="card-connect">
					<span class="card-section-label">Let's Connect</span>
					<ul class="card-connect__list">
						<li>
							<a href="https://www.linkedin.com/in/niloy--biswas/" target="_blank" rel="noopener noreferrer" class="card-connect__item">
								<span class="card-connect__icon" aria-hidden="true"><i class="fa-brands fa-linkedin-in"></i></span>
								<span class="card-connect__value">linkedin.com/in/niloy--biswas</span>
							</a>
						</li>
						<li>
							<a href="mailto:niloy.swe@gmail.com" class="card-connect__item">
								<span class="card-connect__icon" aria-hidden="true"><i class="fa fa-envelope"></i></span>
								<span class="card-connect__value">niloy.swe@gmail.com</span>
							</a>
						</li>
						<li>
							<a href="https://niloy.tech" target="_blank" rel="noopener noreferrer" class="card-connect__item">
								<span class="card-connect__icon" aria-hidden="true"><i class="fa fa-globe"></i></span>
								<span class="card-connect__value">niloy.tech</span>
							</a>
						</li>
					</ul>
				</section>

				<button type="button" id="save-contact" class="card-save-btn">
					<span>Save Contact</span>
					<i class="fa fa-arrow-down" aria-hidden="true"></i>
				</button>
			</div>

		</main>
	</div>

	<script src="../assets/js/card-vcard.js"></script>
</body>
